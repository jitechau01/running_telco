<svg viewBox="0 0 1500 1000" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect width="1500" height="1000" fill="#fafafa"/>
  <text x="750" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a237e">Running Telco — Logical Data Model</text>
  <text x="750" y="55" text-anchor="middle" font-size="12" fill="#666">Entities with key business attributes, PK/FK, generic types — independent of Snowflake physical design</text>

  <!-- Entity box template: header + attribute rows -->
  <!-- CUSTOMER -->
  <g>
    <rect x="600" y="330" width="260" height="230" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
    <rect x="600" y="330" width="260" height="30" fill="#2e7d32"/>
    <text x="730" y="351" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">CUSTOMER</text>
    <text x="612" y="378" font-size="11" font-weight="700" fill="#1b5e20">PK  customer_id</text>
    <text x="612" y="396" font-size="11" fill="#333">   full_name</text>
    <text x="612" y="412" font-size="11" fill="#333">   date_of_birth</text>
    <text x="612" y="428" font-size="11" fill="#333">   national_id</text>
    <text x="612" y="444" font-size="11" fill="#333">   email, phone</text>
    <text x="612" y="460" font-size="11" fill="#333">   address, region</text>
    <text x="612" y="476" font-size="11" fill="#333">   account_status</text>
    <text x="612" y="492" font-size="11" fill="#333">   customer_segment</text>
    <text x="612" y="508" font-size="11" fill="#333">   credit_score</text>
    <text x="612" y="524" font-size="11" font-weight="700" fill="#1565c0">FK  current_plan_id</text>
    <text x="612" y="540" font-size="11" fill="#333">   activation_date</text>
  </g>

  <!-- PLAN -->
  <g>
    <rect x="600" y="60" width="260" height="150" rx="6" fill="#fff" stroke="#1565c0" stroke-width="2"/>
    <rect x="600" y="60" width="260" height="30" fill="#1565c0"/>
    <text x="730" y="81" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">PLAN</text>
    <text x="612" y="108" font-size="11" font-weight="700" fill="#0d47a1">PK  plan_id</text>
    <text x="612" y="126" font-size="11" fill="#333">   plan_name, plan_type</text>
    <text x="612" y="144" font-size="11" fill="#333">   monthly_fee</text>
    <text x="612" y="162" font-size="11" fill="#333">   data_limit, voice_minutes, sms_count</text>
    <text x="612" y="180" font-size="11" fill="#333">   currency, effective_date</text>
  </g>

  <!-- DEVICE -->
  <g>
    <rect x="1000" y="90" width="260" height="150" rx="6" fill="#fff" stroke="#1565c0" stroke-width="2"/>
    <rect x="1000" y="90" width="260" height="30" fill="#1565c0"/>
    <text x="1130" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">DEVICE</text>
    <text x="1012" y="138" font-size="11" font-weight="700" fill="#0d47a1">PK  device_id</text>
    <text x="1012" y="156" font-size="11" fill="#333">   imei</text>
    <text x="1012" y="174" font-size="11" font-weight="700" fill="#1565c0">FK  customer_id</text>
    <text x="1012" y="192" font-size="11" fill="#333">   device_model, device_os</text>
    <text x="1012" y="210" font-size="11" fill="#333">   activation_date, device_status</text>
  </g>

  <!-- USAGE -->
  <g>
    <rect x="1050" y="330" width="280" height="230" rx="6" fill="#fff" stroke="#e65100" stroke-width="2"/>
    <rect x="1050" y="330" width="280" height="30" fill="#e65100"/>
    <text x="1190" y="351" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">USAGE (CDR)</text>
    <text x="1062" y="378" font-size="11" font-weight="700" fill="#bf360c">PK  usage_id</text>
    <text x="1062" y="396" font-size="11" font-weight="700" fill="#1565c0">FK  customer_id</text>
    <text x="1062" y="412" font-size="11" font-weight="700" fill="#1565c0">FK  tower_id</text>
    <text x="1062" y="428" font-size="11" fill="#333">   usage_type (voice/sms/data)</text>
    <text x="1062" y="444" font-size="11" fill="#333">   origin_number, destination_number</text>
    <text x="1062" y="460" font-size="11" fill="#333">   start_ts, end_ts</text>
    <text x="1062" y="476" font-size="11" fill="#333">   duration_seconds</text>
    <text x="1062" y="492" font-size="11" fill="#333">   data_volume_mb</text>
    <text x="1062" y="508" font-size="11" fill="#333">   roaming_flag</text>
    <text x="1062" y="524" font-size="11" fill="#333">   region</text>
  </g>

  <!-- NETWORK TOWER -->
  <g>
    <rect x="1050" y="640" width="260" height="130" rx="6" fill="#fff" stroke="#1565c0" stroke-width="2"/>
    <rect x="1050" y="640" width="260" height="30" fill="#1565c0"/>
    <text x="1180" y="661" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">NETWORK TOWER</text>
    <text x="1062" y="688" font-size="11" font-weight="700" fill="#0d47a1">PK  tower_id</text>
    <text x="1062" y="706" font-size="11" fill="#333">   region</text>
    <text x="1062" y="724" font-size="11" fill="#333">   latitude, longitude</text>
    <text x="1062" y="742" font-size="11" fill="#333">   capacity_mbps, tower_status</text>
  </g>

  <!-- INVOICE -->
  <g>
    <rect x="280" y="620" width="260" height="180" rx="6" fill="#fff" stroke="#e65100" stroke-width="2"/>
    <rect x="280" y="620" width="260" height="30" fill="#e65100"/>
    <text x="410" y="641" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">INVOICE</text>
    <text x="292" y="668" font-size="11" font-weight="700" fill="#bf360c">PK  invoice_id</text>
    <text x="292" y="686" font-size="11" font-weight="700" fill="#1565c0">FK  customer_id</text>
    <text x="292" y="704" font-size="11" font-weight="700" fill="#1565c0">FK  plan_id</text>
    <text x="292" y="722" font-size="11" fill="#333">   billing_period</text>
    <text x="292" y="740" font-size="11" fill="#333">   usage_charges, tax_amount, total_amount</text>
    <text x="292" y="758" font-size="11" fill="#333">   invoice_date, due_date</text>
    <text x="292" y="776" font-size="11" fill="#333">   invoice_status</text>
  </g>

  <!-- PAYMENT -->
  <g>
    <rect x="20" y="330" width="260" height="200" rx="6" fill="#fff" stroke="#e65100" stroke-width="2"/>
    <rect x="20" y="330" width="260" height="30" fill="#e65100"/>
    <text x="150" y="351" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">PAYMENT</text>
    <text x="32" y="378" font-size="11" font-weight="700" fill="#bf360c">PK  payment_id</text>
    <text x="32" y="396" font-size="11" font-weight="700" fill="#1565c0">FK  invoice_id</text>
    <text x="32" y="412" font-size="11" font-weight="700" fill="#1565c0">FK  customer_id</text>
    <text x="32" y="428" font-size="11" fill="#333">   payment_date</text>
    <text x="32" y="444" font-size="11" fill="#333">   amount</text>
    <text x="32" y="460" font-size="11" fill="#333">   payment_method</text>
    <text x="32" y="476" font-size="11" fill="#333">   card_last4</text>
    <text x="32" y="492" font-size="11" fill="#333">   payment_status</text>
  </g>

  <!-- SUPPORT TICKET -->
  <g>
    <rect x="280" y="90" width="260" height="200" rx="6" fill="#fff" stroke="#e65100" stroke-width="2"/>
    <rect x="280" y="90" width="260" height="30" fill="#e65100"/>
    <text x="410" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">SUPPORT TICKET</text>
    <text x="292" y="138" font-size="11" font-weight="700" fill="#bf360c">PK  ticket_id</text>
    <text x="292" y="156" font-size="11" font-weight="700" fill="#1565c0">FK  customer_id</text>
    <text x="292" y="172" font-size="11" fill="#333">   opened_at, closed_at</text>
    <text x="292" y="188" font-size="11" fill="#333">   category, priority</text>
    <text x="292" y="204" font-size="11" fill="#333">   ticket_status, channel</text>
    <text x="292" y="220" font-size="11" fill="#333">   resolution_minutes (derived)</text>
    <text x="292" y="236" font-size="10" fill="#777" font-style="italic">   not stored at source - computed</text>
    <text x="292" y="250" font-size="10" fill="#777" font-style="italic">   downstream from opened/closed_at</text>
  </g>

  <!-- Relationships -->
  <line x1="730" y1="210" x2="730" y2="330" stroke="#37474f" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <text x="740" y="270" font-size="10" fill="#555">1 Plan : M Customer</text>

  <line x1="860" y1="420" x2="1000" y2="270" stroke="#37474f" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <text x="880" y="330" font-size="10" fill="#555">1 Customer : M Device</text>

  <line x1="860" y1="450" x2="1050" y2="450" stroke="#37474f" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <text x="880" y="440" font-size="10" fill="#555">1 Customer : M Usage</text>

  <line x1="1190" y1="560" x2="1180" y2="640" stroke="#37474f" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <text x="1195" y="600" font-size="10" fill="#555">M Usage : 1 Tower</text>

  <line x1="620" y1="500" x2="450" y2="620" stroke="#37474f" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <text x="480" y="580" font-size="10" fill="#555">1 Customer : M Invoice</text>

  <line x1="280" y1="700" x2="280" y2="450" stroke="#37474f" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <text x="180" y="580" font-size="10" fill="#555">1 Invoice : M Payment</text>

  <line x1="600" y1="380" x2="540" y2="220" stroke="#37474f" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <text x="500" y="310" font-size="10" fill="#555">1 Customer : M Ticket</text>

  <!-- Legend -->
  <rect x="20" y="860" width="1460" height="120" rx="8" fill="#fff" stroke="#ccc"/>
  <text x="35" y="885" font-size="12" font-weight="700" fill="#333">Legend</text>
  <text x="35" y="905" font-size="11" fill="#333">PK = Primary (business) Key   ·   FK = Foreign Key (relationship to another entity)</text>
  <text x="35" y="925" font-size="11" fill="#333">Attributes shown are the business-meaningful fields only — surrogate keys, load timestamps, and audit columns are physical-model concerns, added at the next stage.</text>
  <text x="35" y="945" font-size="11" fill="#333">Normalization note: this model is in 3NF — Plan and Device attributes are NOT duplicated onto Customer; they are referenced by FK, exactly as the physical model implements them.</text>
  <text x="35" y="965" font-size="11" fill="#333">Green = core party entity · Blue = reference/catalog entity · Orange = business event/transaction entity (same color convention as the Conceptual model)</text>
</svg>
