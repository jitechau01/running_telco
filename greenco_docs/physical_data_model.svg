  <text x="1080" y="700" font-family="Helvetica" font-size="10" fill="#555">customer_id (all facts)</text>
  <text x="700" y="490" font-family="Helvetica" font-size="10" fill="#555">customer_id</text>
  <text x="1470" y="290" font-family="Helvetica" font-size="10" fill="#555">cell_tower_id</text>
  <text x="600" y="560" font-family="Helvetica" font-size="10" fill="#555">customer_id</text>

  <rect x="60" y="1090" width="0" height="0"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="60" y="1090" width="1570" height="50" rx="6" fill="#fff" stroke="#ccc"/>
    <text x="75" y="1108" font-size="10.5" fill="#333">Green = customer dimension (SCD2, versioned)  ·  Blue = reference dimension (overwrite MERGE)  ·  Orange = fact table  ·  Italic notes = governance policy / clustering / business rule attached at this table</text>
