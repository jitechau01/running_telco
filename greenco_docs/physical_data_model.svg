<svg viewBox="0 0 1700 1150" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect width="1700" height="1150" fill="#fafafa"/>
  <text x="850" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1a237e">Running Telco — Physical Data Model (CURATED schema, as deployed)</text>
  <text x="850" y="53" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">Fact-constellation schema · database.schema.table = RUNNING_TELCO.CURATED.* · matches sql/03_curated_layer/tables_curated.sql exactly</text>

  <!-- DIM_CUSTOMER (center-left, referenced by every fact) -->
  <g>
    <rect x="60" y="380" width="330" height="400" rx="4" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
    <rect x="60" y="380" width="330" height="28" fill="#2e7d32"/>
    <text x="225" y="400" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="700" fill="#fff">CURATED.DIM_CUSTOMER  (SCD2)</text>
    <text x="72" y="425" font-size="10.5" font-weight="700" fill="#1b5e20">PK customer_sk        NUMBER (AUTOINCREMENT)</text>
    <text x="72" y="441" font-size="10.5" fill="#333">   customer_id         VARCHAR(20)  NOT NULL</text>
    <text x="72" y="457" font-size="10.5" fill="#333">   first_name           VARCHAR(100)</text>
    <text x="72" y="473" font-size="10.5" fill="#333">   last_name             VARCHAR(100)</text>
    <text x="72" y="489" font-size="10.5" fill="#333">   date_of_birth          DATE</text>
    <text x="72" y="505" font-size="10.5" fill="#333">   national_id             VARCHAR(30)</text>
    <text x="72" y="521" font-size="10.5" fill="#333">   email                     VARCHAR(200)</text>
    <text x="72" y="537" font-size="10.5" fill="#333">   phone_number               VARCHAR(30)</text>
    <text x="72" y="553" font-size="10.5" fill="#333">   address_line1                VARCHAR(200)</text>
    <text x="72" y="569" font-size="10.5" fill="#333">   city                            VARCHAR(100)</text>
    <text x="72" y="585" font-size="10.5" fill="#333">   region                            VARCHAR(50)</text>
    <text x="72" y="601" font-size="10.5" fill="#333">   postal_code                        VARCHAR(20)</text>
    <text x="72" y="617" font-size="10.5" font-weight="700" fill="#1565c0">FK plan_id                            VARCHAR(20)</text>
    <text x="72" y="633" font-size="10.5" fill="#333">   activation_date                       DATE</text>
    <text x="72" y="649" font-size="10.5" fill="#333">   account_status                          VARCHAR(20)</text>
    <text x="72" y="665" font-size="10.5" fill="#333">   customer_segment                          VARCHAR(30)</text>
    <text x="72" y="681" font-size="10.5" fill="#333">   credit_score                                NUMBER(5,0)</text>
    <text x="72" y="700" font-size="10.5" fill="#8a4400">   eff_start_ts   TIMESTAMP_NTZ  NOT NULL</text>
    <text x="72" y="716" font-size="10.5" fill="#8a4400">   eff_end_ts     TIMESTAMP_NTZ</text>
    <text x="72" y="732" font-size="10.5" fill="#8a4400">   is_current     BOOLEAN  DEFAULT TRUE</text>
    <text x="72" y="755" font-size="9.5" font-style="italic" fill="#777">RAP_REGION_RESTRICT ON (region)</text>
    <text x="72" y="769" font-size="9.5" font-style="italic" fill="#777">masking: national_id, email, phone_number,</text>
    <text x="72" y="783" font-size="9.5" font-style="italic" fill="#777">address_line1, date_of_birth</text>
  </g>

  <!-- DIM_PLAN -->
  <g>
    <rect x="60" y="60" width="330" height="180" rx="4" fill="#fff" stroke="#1565c0" stroke-width="2"/>
    <rect x="60" y="60" width="330" height="28" fill="#1565c0"/>
    <text x="225" y="80" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="700" fill="#fff">CURATED.DIM_PLAN</text>
    <text x="72" y="105" font-size="10.5" font-weight="700" fill="#0d47a1">PK plan_sk       NUMBER (AUTOINCREMENT)</text>
    <text x="72" y="121" font-size="10.5" fill="#333">   plan_id        VARCHAR(20)  NOT NULL</text>
    <text x="72" y="137" font-size="10.5" fill="#333">   plan_name        VARCHAR(100)</text>
    <text x="72" y="153" font-size="10.5" fill="#333">   plan_type          VARCHAR(20)</text>
    <text x="72" y="169" font-size="10.5" fill="#333">   monthly_fee          NUMBER(10,2)</text>
    <text x="72" y="185" font-size="10.5" fill="#333">   data_limit_gb           NUMBER(10,2)</text>
    <text x="72" y="201" font-size="10.5" fill="#333">   voice_minutes, sms_count  NUMBER(10,0)</text>
    <text x="72" y="217" font-size="10.5" fill="#333">   currency, effective_date   VARCHAR/DATE</text>
  </g>

  <!-- DIM_DEVICE -->
  <g>
    <rect x="440" y="60" width="330" height="150" rx="4" fill="#fff" stroke="#1565c0" stroke-width="2"/>
    <rect x="440" y="60" width="330" height="28" fill="#1565c0"/>
    <text x="605" y="80" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="700" fill="#fff">CURATED.DIM_DEVICE</text>
    <text x="452" y="105" font-size="10.5" font-weight="700" fill="#0d47a1">PK device_sk     NUMBER (AUTOINCREMENT)</text>
    <text x="452" y="121" font-size="10.5" fill="#333">   device_id      VARCHAR(20)  NOT NULL</text>
    <text x="452" y="137" font-size="10.5" fill="#333">   imei             VARCHAR(30)</text>
    <text x="452" y="153" font-size="10.5" font-weight="700" fill="#1565c0">FK customer_id      VARCHAR(20)</text>
    <text x="452" y="169" font-size="10.5" fill="#333">   device_model, device_os  VARCHAR</text>
    <text x="452" y="185" font-size="10.5" fill="#333">   activation_date, device_status</text>
  </g>

  <!-- DIM_TOWER -->
  <g>
    <rect x="1300" y="60" width="330" height="170" rx="4" fill="#fff" stroke="#1565c0" stroke-width="2"/>
    <rect x="1300" y="60" width="330" height="28" fill="#1565c0"/>
    <text x="1465" y="80" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="700" fill="#fff">CURATED.DIM_TOWER</text>
    <text x="1312" y="105" font-size="10.5" font-weight="700" fill="#0d47a1">PK tower_sk      NUMBER (AUTOINCREMENT)</text>
    <text x="1312" y="121" font-size="10.5" fill="#333">   tower_id       VARCHAR(20)  NOT NULL</text>
    <text x="1312" y="137" font-size="10.5" fill="#333">   region           VARCHAR(50)</text>
    <text x="1312" y="153" font-size="10.5" fill="#333">   latitude           NUMBER(9,6)</text>
    <text x="1312" y="169" font-size="10.5" fill="#333">   longitude            NUMBER(9,6)</text>
    <text x="1312" y="185" font-size="10.5" fill="#333">   capacity_mbps          NUMBER(10,0)</text>
    <text x="1312" y="201" font-size="10.5" fill="#333">   tower_status              VARCHAR(20)</text>
    <text x="1312" y="217" font-size="9.5" font-style="italic" fill="#777">RAP_REGION_RESTRICT ON (region)</text>
  </g>

  <!-- FACT_CDR_USAGE -->
  <g>
    <rect x="1300" y="330" width="360" height="380" rx="4" fill="#fff" stroke="#e65100" stroke-width="2"/>
    <rect x="1300" y="330" width="360" height="28" fill="#e65100"/>
    <text x="1480" y="350" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="700" fill="#fff">CURATED.FACT_CDR_USAGE</text>
    <text x="1312" y="375" font-size="10.5" font-weight="700" fill="#bf360c">PK cdr_id           VARCHAR(40)  NOT NULL</text>
    <text x="1312" y="391" font-size="10.5" font-weight="700" fill="#1565c0">FK customer_id       VARCHAR(20)</text>
    <text x="1312" y="407" font-size="10.5" fill="#333">   call_type              VARCHAR(10)</text>
    <text x="1312" y="423" font-size="10.5" fill="#333">   origin_number            VARCHAR(30)</text>
    <text x="1312" y="439" font-size="10.5" fill="#333">   destination_number         VARCHAR(30)</text>
    <text x="1312" y="455" font-size="10.5" font-weight="700" fill="#1565c0">FK cell_tower_id              VARCHAR(20)</text>
    <text x="1312" y="471" font-size="10.5" fill="#333">   call_start_ts                    TIMESTAMP_NTZ</text>
    <text x="1312" y="487" font-size="10.5" fill="#333">   call_end_ts                        TIMESTAMP_NTZ</text>
    <text x="1312" y="503" font-size="10.5" fill="#333">   duration_seconds                      NUMBER(10,0)</text>
    <text x="1312" y="519" font-size="10.5" fill="#333">   data_volume_mb                           NUMBER(12,3)</text>
    <text x="1312" y="535" font-size="10.5" fill="#333">   roaming_flag                                BOOLEAN</text>
    <text x="1312" y="551" font-size="10.5" fill="#333">   region                                        VARCHAR(50)</text>
    <text x="1312" y="567" font-size="10.5" fill="#8a4400">   usage_date (derived)                            DATE</text>
    <text x="1312" y="583" font-size="10.5" fill="#333">   loaded_at                                          TIMESTAMP_NTZ</text>
    <text x="1312" y="605" font-size="9.5" font-style="italic" fill="#777">CLUSTER BY (usage_date, region)</text>
    <text x="1312" y="619" font-size="9.5" font-style="italic" fill="#777">RAP_REGION_RESTRICT ON (region)</text>
    <text x="1312" y="633" font-size="9.5" font-style="italic" fill="#777">masking: origin_number, destination_number</text>
    <text x="1312" y="647" font-size="9.5" font-style="italic" fill="#777">grain: 1 row per call/sms/data session</text>
    <text x="1312" y="661" font-size="9.5" font-style="italic" fill="#777">load: INSERT-ONLY (immutable fact)</text>
  </g>

  <!-- FACT_BILLING -->
  <g>
    <rect x="440" y="850" width="330" height="270" rx="4" fill="#fff" stroke="#e65100" stroke-width="2"/>
    <rect x="440" y="850" width="330" height="28" fill="#e65100"/>
    <text x="605" y="870" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="700" fill="#fff">CURATED.FACT_BILLING</text>
    <text x="452" y="895" font-size="10.5" font-weight="700" fill="#bf360c">PK invoice_id      VARCHAR(20)  NOT NULL</text>
    <text x="452" y="911" font-size="10.5" font-weight="700" fill="#1565c0">FK customer_id      VARCHAR(20)</text>
    <text x="452" y="927" font-size="10.5" fill="#333">   billing_period       VARCHAR(10)</text>
    <text x="452" y="943" font-size="10.5" font-weight="700" fill="#1565c0">FK plan_id                VARCHAR(20)</text>
    <text x="452" y="959" font-size="10.5" fill="#333">   usage_charges                NUMBER(12,2)</text>
    <text x="452" y="975" font-size="10.5" fill="#333">   tax_amount                       NUMBER(12,2)</text>
    <text x="452" y="991" font-size="10.5" fill="#333">   total_amount                         NUMBER(12,2)</text>
    <text x="452" y="1007" font-size="10.5" fill="#333">   invoice_date, due_date                    DATE</text>
    <text x="452" y="1023" font-size="10.5" fill="#333">   invoice_status                                VARCHAR(20)</text>
    <text x="452" y="1039" font-size="10.5" fill="#333">   loaded_at                                        TIMESTAMP_NTZ</text>
    <text x="452" y="1060" font-size="9.5" font-style="italic" fill="#777">tags: total_amount, usage_charges = FINANCIAL</text>
    <text x="452" y="1074" font-size="9.5" font-style="italic" fill="#777">grain: 1 row per invoice</text>
    <text x="452" y="1088" font-size="9.5" font-style="italic" fill="#777">update cols: total_amount, invoice_status only</text>
  </g>

  <!-- FACT_PAYMENTS -->
  <g>
    <rect x="60" y="850" width="330" height="270" rx="4" fill="#fff" stroke="#e65100" stroke-width="2"/>
    <rect x="60" y="850" width="330" height="28" fill="#e65100"/>
    <text x="225" y="870" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="700" fill="#fff">CURATED.FACT_PAYMENTS</text>
    <text x="72" y="895" font-size="10.5" font-weight="700" fill="#bf360c">PK payment_id     VARCHAR(20)  NOT NULL</text>
    <text x="72" y="911" font-size="10.5" font-weight="700" fill="#1565c0">FK invoice_id       VARCHAR(20)</text>
    <text x="72" y="927" font-size="10.5" font-weight="700" fill="#1565c0">FK customer_id            VARCHAR(20)</text>
    <text x="72" y="943" font-size="10.5" fill="#333">   payment_date                  DATE</text>
    <text x="72" y="959" font-size="10.5" fill="#333">   amount                            NUMBER(12,2)</text>
    <text x="72" y="975" font-size="10.5" fill="#333">   payment_method                        VARCHAR(30)</text>
    <text x="72" y="991" font-size="10.5" fill="#333">   card_last4                                VARCHAR(10)</text>
    <text x="72" y="1007" font-size="10.5" fill="#333">   payment_status                                VARCHAR(20)</text>
    <text x="72" y="1023" font-size="10.5" fill="#333">   loaded_at                                        TIMESTAMP_NTZ</text>
    <text x="72" y="1044" font-size="9.5" font-style="italic" fill="#777">masking: card_last4</text>
    <text x="72" y="1058" font-size="9.5" font-style="italic" fill="#777">grain: 1 row per payment</text>
    <text x="72" y="1072" font-size="9.5" font-style="italic" fill="#777">business rule: only payment_status='SUCCESS'</text>
    <text x="72" y="1086" font-size="9.5" font-style="italic" fill="#777">counts toward collected revenue</text>
  </g>

  <!-- FACT_SUPPORT_TICKETS -->
  <g>
    <rect x="820" y="380" width="330" height="330" rx="4" fill="#fff" stroke="#e65100" stroke-width="2"/>
    <rect x="820" y="380" width="330" height="28" fill="#e65100"/>
    <text x="985" y="400" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="700" fill="#fff">CURATED.FACT_SUPPORT_TICKETS</text>
    <text x="832" y="425" font-size="10.5" font-weight="700" fill="#bf360c">PK ticket_id      VARCHAR(20)  NOT NULL</text>
    <text x="832" y="441" font-size="10.5" font-weight="700" fill="#1565c0">FK customer_id      VARCHAR(20)</text>
    <text x="832" y="457" font-size="10.5" fill="#333">   opened_at              TIMESTAMP_NTZ</text>
    <text x="832" y="473" font-size="10.5" fill="#333">   closed_at                  TIMESTAMP_NTZ</text>
    <text x="832" y="489" font-size="10.5" fill="#333">   category                       VARCHAR(50)</text>
    <text x="832" y="505" font-size="10.5" fill="#333">   priority                          VARCHAR(10)</text>
    <text x="832" y="521" font-size="10.5" fill="#333">   ticket_status                        VARCHAR(20)</text>
    <text x="832" y="537" font-size="10.5" fill="#333">   channel                                 VARCHAR(20)</text>
    <text x="832" y="553" font-size="10.5" fill="#8a4400">   resolution_minutes (derived)               NUMBER(10,0)</text>
    <text x="832" y="569" font-size="10.5" fill="#333">   loaded_at                                       TIMESTAMP_NTZ</text>
    <text x="832" y="590" font-size="9.5" font-style="italic" fill="#777">resolution_minutes = DATEDIFF(minute, opened_at, closed_at)</text>
    <text x="832" y="604" font-size="9.5" font-style="italic" fill="#777">grain: 1 row per ticket</text>
    <text x="832" y="618" font-size="9.5" font-style="italic" fill="#777">update cols: closed_at, ticket_status, resolution_minutes</text>
  </g>

